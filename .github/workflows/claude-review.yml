name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
            
            You are now operating as a Software Architect, not a coder.
            Snalyze the changes in this PR and focus on identifying critical issues related to:
            - Potential bugs or issues
            - Performance
            - Correctness
            - FRC/WPILib specific concerns
            - FRC 2026 Season - REBUILT Game

            If critical issues are found, list them in a few short bullet points. If no critical issues are found, provide a simple approval.
            Sign off with a checkbox emoji:  (approved) or  (issues found).

            Keep your response concise. Only highlight critical issues that must be addressed before merging. 
            Skip detailed style or minor suggestions unless they impact performance, or correctness. 

            The PR branch is already checked out.

            Use `gh pr comment` for top-level feedback.
            Only post GitHub comments - don't edit any code files.

          claude_args: |
            --model claude-opus-4-6
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep,Task,WebSearch""
